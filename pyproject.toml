[tool.poetry]
name = "chatbot-safety"
version = "0.1.0"
description = "Experimentation/analysis code and scripts"
authors = [
    "Zachary Levonian <zach@levi.digitalharbor.org>"
]
license = "MIT"
readme = "README.md"
packages = [{include = "student_guardrails", from = "src"}]
repository = "https://github.com/DigitalHarborFoundation/chatbot-safety.git"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
jupyter = "^1.1.1"
jupyterlab = "^4.6.4"
numpy = "^2.5.4"
scipy = "^1.18.1"
pandas = "^3.1.0"
matplotlib = "^3.11.2"
keyrings-google-artifactregistry-auth = "^1.1.2"
statsmodels = "^0.15.0"
sendgrid = "^6.12.5"
tenacity = "^9.2.1"
openai = "^3.38.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
flake8 = "^7.4.1"
nbqa = "^1.9.1"
pre-commit = "^4.7.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
      .eggs         # exclude a few common directories in the
    | .git          # root of the project
    | .github
    | .gitignore
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | venv
    | _build
    | buck-out
    | build
    | ci
    | data
    | dist
    | docs
    | docsrc
  )/
'''

[tool.isort]
profile = "black"
line_length = 159
multi_line_output = 3
include_trailing_comma = true
virtual_env = "venv"
